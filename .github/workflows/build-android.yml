name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

env:
  GODOT_VERSION: 4.3-stable
  EXPORT_NAME: CatchAMonster

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Keystore OK: $(ls -la ~/.android/debug.keystore)"

      - name: Download Godot
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          mv Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 godot
          echo "Godot: $(~/godot/godot --version)"

      - name: Download Export Templates
        run: |
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpl
          # Godot yêu cầu thư mục tên "4.3.stable" (dấu chấm, không phải gạch ngang)
          TPLDIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TPLDIR"
          if [ -d /tmp/tpl/templates ]; then
            cp -r /tmp/tpl/templates/* "$TPLDIR/"
          else
            cp -r /tmp/tpl/* "$TPLDIR/"
          fi
          echo "Templates:"
          ls "$TPLDIR/" | grep android || echo "WARN: no android template found!"

      - name: Configure Godot Android settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "editor_settings:"
          cat ~/.config/godot/editor_settings-4.tres

      - name: Check export_presets.cfg
        run: |
          echo "=== export_presets.cfg ==="
          cat export_presets.cfg

      - name: Export APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --verbose --export-debug "Android" "$PWD/build/${{ env.EXPORT_NAME }}.apk" 2>&1
          echo "=== build/ ==="
          ls -la build/ || echo "EMPTY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatchAMonster-APK
          path: build/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error
          retention-days: 14
