name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

env:
  GODOT_VERSION: 4.3-stable
  GODOT_VERSION_DOTTED: 4.3.stable
  EXPORT_NAME: CatchAMonster

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot + Export Templates
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          mv Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -O templates.tpz
          # ✅ Dùng GODOT_VERSION_DOTTED (4.3.stable) đúng với Godot yêu cầu
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_DOTTED }}
          unzip -q templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_DOTTED }}/
          else
            cp -r /tmp/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_DOTTED }}/
          fi
          echo "Templates: $(ls ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_DOTTED }}/)"

      - name: Configure Godot Android settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-debug "Android" ./build/${{ env.EXPORT_NAME }}.apk 2>&1
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatchAMonster-APK
          path: build/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error
          retention-days: 14
